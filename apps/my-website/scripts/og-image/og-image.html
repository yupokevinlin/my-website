<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The share image for the home page (1200 x 630): the hero in miniature. The season's
     illustration of Vancouver (winter, the site's default palette) with the sky behind it, and
     the frosted card with who Kevin is. Previews often show it 400-550 px wide, so the text is
     big: check the small render before committing. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif;
    /* As on the home page: the picture covers the frame, bottom edge in view, over its sky */
    background:
      url("../../public/resources/seasons/winter.svg") 70% 100% / cover no-repeat,
      linear-gradient(0deg, #ffffff 50%, #e4ecf4 80%, #91b4d2 100%);
    position: relative;
  }
  .card {
    position: absolute; left: 60px; top: 50%; transform: translateY(-50%);
    width: 650px; padding: 50px 50px 52px;
    border-radius: 36px; border: 1.5px solid rgba(255, 255, 255, 0.75);
    background: rgba(255, 255, 255, 0.76);
    backdrop-filter: blur(24px);
    box-shadow: 0 40px 100px -40px rgba(15, 23, 42, 0.55);
  }
  .eyebrow { font-size: 22px; line-height: 1; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #2c5e8b; }
  h1 { margin-top: 18px; font-size: 112px; line-height: 1; font-weight: 700; letter-spacing: -0.035em; color: #161b22; }
  .title { margin-top: 16px; font-size: 36px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: #2c5e8b; white-space: nowrap; }
  .roles { margin-top: 26px; padding-top: 24px; border-top: 2px solid rgba(48, 101, 150, 0.18); font-size: 29px; line-height: 1.35; color: #333c47; }
  .roles b { font-weight: 600; color: #161b22; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">kevinyupolin.dev · Vancouver, BC</p>
    <h1>Kevin Lin</h1>
    <p class="title">Senior Full-Stack + AI Engineer</p>
    <p class="roles">Tech lead at <b>Best Buy Canada</b><br>Co-founder &amp; CTO of <b>ForteCare</b></p>
  </div>
</body>
</html>
