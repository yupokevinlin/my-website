<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="disc" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffe8c4"/>
      <stop offset="0.55" stop-color="#f2a65a"/>
      <stop offset="1" stop-color="#b8661f"/>
    </linearGradient>
    <radialGradient id="glow" cx="12" cy="11.6" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="12" cy="12" r="12" fill="#07080d"/>
  <!-- far side of the disc, lensed over the top of the shadow -->
  <path d="M2.8 12.6 A9.2 2.2 0 0 1 21.2 12.6" fill="none" stroke="url(#disc)" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="12" cy="11.6" r="8" fill="url(#glow)"/>
  <circle cx="12" cy="11.6" r="4.2" fill="#000" stroke="#fff3e0" stroke-width="0.8"/>
  <!-- near side of the disc, in front of the shadow -->
  <path d="M2.8 12.6 A9.2 2.2 0 0 0 21.2 12.6" fill="none" stroke="url(#disc)" stroke-width="1.7" stroke-linecap="round"/>
</svg>
